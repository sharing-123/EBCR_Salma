<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 262" width="1280" height="262" role="img"><defs><linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06141a"/><stop offset="0.6" stop-color="#0d2a30"/><stop offset="1" stop-color="#14202e"/></linearGradient><linearGradient id="edgep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.8"/><stop offset="0.5" stop-color="#f2b5a7" stop-opacity="0.25"/><stop offset="1" stop-color="#f2b5a7" stop-opacity="0.8"/></linearGradient><filter id="blurp" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="55"/></filter><style>.card{opacity:0;animation:cardin 1s ease forwards}@keyframes cardin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}.glow{animation:glow 4.8s ease-in-out infinite}@keyframes glow{0%,100%{opacity:0.25}50%{opacity:0.9}}</style></defs><rect width="1280" height="262" rx="26" fill="url(#bgp)"/><g filter="url(#blurp)" opacity="0.55"><circle cx="153" cy="52" r="150" fill="#0f766e"><animateTransform attributeName="transform" type="translate" values="0 0;60 30;0 0" dur="16s" repeatCount="indefinite"/></circle><circle cx="1100" cy="222" r="130" fill="#7a3e55"><animateTransform attributeName="transform" type="translate" values="0 0;-70 -20;0 0" dur="19s" repeatCount="indefinite"/></circle><circle cx="640" cy="248" r="110" fill="#3b2a5e"><animateTransform attributeName="transform" type="translate" values="0 0;-40 40;0 0" dur="22s" repeatCount="indefinite"/></circle></g><rect x="1.5" y="1.5" width="1277" height="259" rx="25" fill="none" stroke="url(#edgep)" stroke-width="1.6"/><rect x="1.5" y="1.5" width="1277" height="259" rx="25" fill="none" stroke="#2dd4bf" stroke-width="2" pathLength="100" stroke-dasharray="6 94" opacity="0.9"><animate attributeName="stroke-dashoffset" values="0;-100" dur="9s" repeatCount="indefinite"/></rect><text x="48" y="52" fill="#2dd4bf" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5">PERTANYAAN KLINIS</text><g class="card" style="animation-delay:0.3s"><rect x="48" y="74" width="288" height="156" rx="18" fill="rgba(255,255,255,0.04)" stroke="#2dd4bf" stroke-opacity="0.35"/><rect class="glow" x="48" y="74" width="288" height="156" rx="18" fill="none" stroke="#2dd4bf" stroke-width="1.8" style="animation-delay:0.0s"/><text x="72" y="136" fill="#2dd4bf" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">P</text><text x="126" y="118" fill="#8fa8ad" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="3" fill-opacity="0.85">POPULATION</text><text x="72" y="172" fill="#f3ece4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">Dewasa dengan edema paru</text><text x="72" y="194" fill="#f3ece4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">kardiogenik akut dan gagal</text><text x="72" y="216" fill="#f3ece4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">napas hipoksemik di IGD</text></g><g class="card" style="animation-delay:0.6s"><rect x="352" y="74" width="288" height="156" rx="18" fill="rgba(255,255,255,0.04)" stroke="#f2b5a7" stroke-opacity="0.35"/><rect class="glow" x="352" y="74" width="288" height="156" rx="18" fill="none" stroke="#f2b5a7" stroke-width="1.8" style="animation-delay:1.2s"/><text x="376" y="136" fill="#f2b5a7" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">I</text><text x="430" y="118" fill="#8fa8ad" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="3" fill-opacity="0.85">INTERVENTION</text><text x="376" y="172" fill="#f3ece4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">Ventilasi noninvasif, CPAP atau</text><text x="376" y="194" fill="#f3ece4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">BiPAP</text></g><g class="card" style